<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: dark navy rounded square -->
  <rect width="512" height="512" rx="80" fill="#0F172A"/>
  
  <!-- Glass pane: tilted viewport, single clean pane -->
  <g transform="translate(256, 256) rotate(-12)">
    <!-- Main glass -->
    <rect x="-110" y="-140" width="220" height="280" rx="16" 
          fill="url(#glassA)" stroke="#3B82F6" stroke-width="4"/>
    <!-- Reflection edge -->
    <rect x="-106" y="-136" width="60" height="120" rx="12" 
          fill="#ffffff" opacity="0.06"/>
  </g>
  
  <defs>
    <linearGradient id="glassA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1E3A5F" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
</svg>
