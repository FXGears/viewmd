<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0F172A"/>
  
  <!-- Back pane (shadow/depth) -->
  <g transform="translate(270, 270) rotate(-12)">
    <rect x="-100" y="-130" width="200" height="260" rx="14" 
          fill="#1E3A5F" fill-opacity="0.3" stroke="#3B82F6" stroke-width="3" stroke-opacity="0.4"/>
  </g>
  
  <!-- Front pane (primary) -->
  <g transform="translate(242, 242) rotate(-12)">
    <rect x="-100" y="-130" width="200" height="260" rx="14" 
          fill="url(#glassD)" stroke="#3B82F6" stroke-width="4"/>
    <!-- Reflection -->
    <rect x="-86" y="-116" width="45" height="90" rx="10" 
          fill="#ffffff" opacity="0.05"/>
  </g>
  
  <defs>
    <linearGradient id="glassD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E3A5F" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
</svg>
