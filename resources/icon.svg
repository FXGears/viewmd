<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: dark navy rounded square -->
  <rect width="512" height="512" rx="80" fill="#0F172A"/>
  
  <!-- Glass pane: tilted viewport rectangle -->
  <g transform="translate(256, 256) rotate(-8)">
    <!-- Main glass pane -->
    <rect x="-130" y="-160" width="260" height="320" rx="12" 
          fill="url(#glass)" stroke="#64748B" stroke-width="2"/>
    
    <!-- Content lines visible "through" the glass -->
    <rect x="-90" y="-120" width="120" height="8" rx="4" fill="#94A3B8" opacity="0.6"/>
    <rect x="-90" y="-96" width="160" height="5" rx="2.5" fill="#64748B" opacity="0.4"/>
    <rect x="-90" y="-78" width="140" height="5" rx="2.5" fill="#64748B" opacity="0.4"/>
    <rect x="-90" y="-60" width="155" height="5" rx="2.5" fill="#64748B" opacity="0.4"/>
    
    <rect x="-90" y="-34" width="100" height="7" rx="3.5" fill="#94A3B8" opacity="0.5"/>
    <rect x="-90" y="-14" width="150" height="5" rx="2.5" fill="#64748B" opacity="0.4"/>
    <rect x="-90" y="4" width="130" height="5" rx="2.5" fill="#64748B" opacity="0.4"/>
    <rect x="-90" y="22" width="145" height="5" rx="2.5" fill="#64748B" opacity="0.4"/>
    <rect x="-90" y="40" width="110" height="5" rx="2.5" fill="#64748B" opacity="0.4"/>
    
    <rect x="-90" y="66" width="80" height="7" rx="3.5" fill="#94A3B8" opacity="0.5"/>
    <rect x="-90" y="86" width="155" height="5" rx="2.5" fill="#64748B" opacity="0.4"/>
    <rect x="-90" y="104" width="135" height="5" rx="2.5" fill="#64748B" opacity="0.4"/>
    <rect x="-90" y="122" width="148" height="5" rx="2.5" fill="#64748B" opacity="0.4"/>
  </g>
  
  <!-- Gradient definition for the glass pane -->
  <defs>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F2440" stop-opacity="0.98"/>
    </linearGradient>
  </defs>
</svg>
