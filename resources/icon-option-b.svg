<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: dark navy rounded square -->
  <rect width="512" height="512" rx="80" fill="#0F172A"/>
  
  <!-- Viewport frame - rounded rectangle outline with open center -->
  <rect x="116" y="96" width="280" height="320" rx="24" 
        fill="none" stroke="#3B82F6" stroke-width="20"/>
  
  <!-- Top bar accent (like a window title bar hint) -->
  <rect x="136" y="116" width="80" height="6" rx="3" fill="#60A5FA" opacity="0.7"/>
  
  <!-- Inner opening glow -->
  <rect x="136" y="140" width="240" height="256" rx="12" 
        fill="#1E3A5F" opacity="0.3"/>
</svg>
