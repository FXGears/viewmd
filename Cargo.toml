[package]
name = "mdview"
version = "0.1.0"
edition = "2024"
description = "Lightweight Win11 markdown viewer"

[dependencies]
wry = "0.51"
tao = "0.33"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
