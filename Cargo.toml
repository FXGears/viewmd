[package]
name = "viewmd"
version = "0.1.0"
edition = "2024"
description = "ViewMD - Lightweight markdown viewer for Windows"
license = "GPL-3.0-only"

[dependencies]
wry = "0.51"
tao = "0.33"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
